<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:#e9e9ec;font:400 13px -apple-system,"PingFang SC",sans-serif;color:#1d1d1f}
.wrap{width:1600px;padding:22px 22px 26px}
h1{margin:0 0 3px;font-size:18px;font-weight:650}
p{margin:0 0 16px;font-size:12.5px;color:#5f5f66}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cell{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.10)}
.cap{display:flex;gap:8px;align-items:baseline;padding:9px 12px;border-bottom:.5px solid rgba(0,0,0,.10);background:#fbfbfd}
.cap b{font-size:12.5px}.cap span{font-size:11.5px;color:#6e6e73}
.cell img{display:block;width:100%}
</style></head><body><div class="wrap">
<h1>面板即会话 · 四态总览</h1>
<p>① + 启动台　② 新面板空态（原生 composer）　③ 运行中（状态点 + 队列）　④ 只读线程（无输入框）</p>
<div class="grid">
<div class="cell"><div class="cap"><b>① 「+」启动台</b><span>Codex 式：分区 + 搜索 + 键位常显</span></div><img src="./shots/slim-1.png"></div>
<div class="cell"><div class="cap"><b>② 新面板空态</b><span>原生 composer：附件/@/斜杠/模型/权限</span></div><img src="./shots/slim-2.png"></div>
<div class="cell"><div class="cap"><b>③ 运行中</b><span>四态点挂 tab；队列 chip 在输入框上方</span></div><img src="./shots/slim-3.png"></div>
<div class="cell"><div class="cap"><b>④ 只读线程</b><span>没有输入框，只有「接着问 → 新会话」</span></div><img src="./shots/slim-4.png"></div>
</div></div></body></html>
